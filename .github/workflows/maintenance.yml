name: maintenance

# Monthly: open an issue when a newer libwiitls release than the vendored one exists.

on:
  schedule:
    - cron: '0 4 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  libwiitls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the vendored libwiitls with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(grep -oE 'libwiitls [0-9]+\.[0-9]+\.[0-9]+' THIRD_PARTY.md | head -1 | cut -d' ' -f2)
          NEW=$(gh api repos/pudding-pudding00/libwiitls/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "vendored=$CUR latest=$NEW"
          [ -n "$CUR" ] && [ -n "$NEW" ] || { echo "::error::could not determine versions"; exit 1; }
          [ "$CUR" != "$NEW" ] || exit 0
          TITLE="Update libwiitls to $NEW"
          FOUND=$(gh issue list --state all --limit 100 --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
          [ "$FOUND" -eq 0 ] || { echo "issue already exists"; exit 0; }
          gh issue create --title "$TITLE" --body "libwiitls $NEW is available (vendored: $CUR).

          Update with \`python tools/vendor_wii_tls.py <checkout> --rev v$NEW\`, then update THIRD_PARTY.md and run the tests."
