name: Hardware report
description: Results of the hardware acceptance checklist on your console.
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! The checklist is in docs/hardware-acceptance.md.
  - type: input
    id: version
    attributes:
      label: newlauncher version or commit
    validations:
      required: true
  - type: input
    id: console
    attributes:
      label: Console and setup
      description: Model (e.g. RVL-001, RVL-101, vWii), System Menu version, d2x cIOS, Nintendont version, SD/USB.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Item IDs with PASS/FAIL and notes.
    validations:
      required: true
  - type: textarea
    id: perf
    attributes:
      label: Performance table (optional)
      description: Output of `python tools/check_perf.py`.
      render: text
