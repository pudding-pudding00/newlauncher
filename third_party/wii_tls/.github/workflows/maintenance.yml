name: maintenance

on:
  schedule:
    # Monthly on the 1st at 04:00 UTC: CA bundle, Mbed TLS 4.1.x LTS, and zlib
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  ca-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Mozilla CA bundle and open PR if updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o /tmp/cacert.pem https://curl.se/ca/cacert.pem
          curl -fsSL -o /tmp/cacert.pem.sha256 https://curl.se/ca/cacert.pem.sha256
          OLD=$(awk '{print $1}' data/cacert.pem.sha256)
          NEW=$(awk '{print $1}' /tmp/cacert.pem.sha256)
          echo "CA bundle current=$OLD upstream=$NEW"
          if [ "$OLD" != "$NEW" ]; then
            cp /tmp/cacert.pem data/cacert.pem
            cp /tmp/cacert.pem.sha256 data/cacert.pem.sha256
            python3 tools/gen_ca_bundle.py --pem data/cacert.pem \
              --sha256 data/cacert.pem.sha256 --out src/gen/ca_bundle.c

            BRANCH="chore/ca-bundle-update"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$BRANCH"
            git add data/cacert.pem data/cacert.pem.sha256 src/gen/ca_bundle.c
            git commit -m "chore: update Mozilla CA bundle (${NEW:0:12})"
            git push -f origin "$BRANCH"

            if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" -eq 0 ]; then
              gh pr create \
                --head "$BRANCH" \
                --base main \
                --title "chore: update Mozilla CA bundle" \
                --body "Automated monthly CA bundle update from \`https://curl.se/ca/cacert.pem\`.

          - SHA-256: \`$NEW\`
          - Regenerated: \`src/gen/ca_bundle.c\`

          Please check the diff and trigger/verify CI before merging."
            fi
            git checkout main
          fi

  dependencies:
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: mbedtls
            name: Mbed TLS
            upstream: Mbed-TLS/mbedtls
          - dep: zlib
            name: zlib
            upstream: madler/zlib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Open a pull request for a new ${{ matrix.name }} release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEP: ${{ matrix.dep }}
          NAME: ${{ matrix.name }}
          UPSTREAM: ${{ matrix.upstream }}
        run: |
          CUR=$(python3 tools/update_dep.py current "$DEP")
          VER=$(gh api "repos/$UPSTREAM/releases?per_page=100" | python3 tools/update_dep.py check "$DEP")
          echo "$NAME current=$CUR newer=${VER:-none}"
          [ -n "$VER" ] || exit 0

          # One branch per version: an open pull request keeps any fixes pushed
          # to it, and a closed one is not reopened.
          BRANCH="chore/$DEP-$VER"
          EXISTING=$(gh pr list --head "$BRANCH" --state all --json number --jq length)
          if [ "$EXISTING" -ne 0 ]; then
            echo "A pull request for $BRANCH already exists: leaving it alone."
            exit 0
          fi

          URL=$(python3 tools/update_dep.py url "$DEP" "$VER")
          curl -fsSL -o "$RUNNER_TEMP/dep.tar" "$URL"
          SHA=$(sha256sum "$RUNNER_TEMP/dep.tar" | cut -d' ' -f1)
          python3 tools/update_dep.py apply "$DEP" "$VER" --sha256 "$SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(deps): update $NAME to $VER"
          git push -f origin "$BRANCH"

          TAG=$(basename "${URL%/*}")
          {
            echo "Automated update of $NAME from $CUR to **$VER**."
            echo
            echo "- Release: https://github.com/$UPSTREAM/releases/tag/$TAG"
            echo "- Tarball: $URL"
            echo "- SHA-256 of the downloaded tarball: $SHA"
            echo
            echo "CI for this pull request waits for approval: choose **Approve workflows to run**."
            echo
            echo "Before merging:"
            echo "- [ ] Read the upstream release notes and compare the SHA-256 with a published one"
            echo "- [ ] CI passes (configure-time patch anchors, host, sanitizers, fuzzing, Wii build)"
            echo "- [ ] Add a CHANGELOG.md entry"
            echo "- [ ] Run the Wii hardware suites if crypto or I/O behaviour changed"
            ISSUES=$(gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"Update $NAME to $VER\") | .number")
            for n in $ISSUES; do
              echo
              echo "Closes #$n"
            done
          } > "$RUNNER_TEMP/body.md"

          gh pr create --head "$BRANCH" --base main \
            --title "chore(deps): update $NAME to $VER" \
            --body-file "$RUNNER_TEMP/body.md"
